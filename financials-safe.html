<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GAP CRM — Safe Job Financials</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}body{margin:0;background:#F6F4EF;color:#242220;font-family:Inter,sans-serif}.wrap{max-width:1080px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:end;gap:10px;flex-wrap:wrap;border-bottom:3px solid #B5451C;padding-bottom:12px;margin-bottom:16px}.brand{font:600 25px Oswald,sans-serif}.brand span{color:#B5451C}.sub{font-size:11px;color:#6F6C63;text-transform:uppercase}.card{background:#fff;border:1px solid #DEDBD1;border-radius:9px;padding:16px;margin-bottom:14px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.field{flex:1 1 175px}.field label{display:block;font-size:10.5px;text-transform:uppercase;color:#6F6C63;margin-bottom:4px}.field input,.field select{width:100%;padding:8px;border:1px solid #DEDBD1;border-radius:6px}.title{font:500 17px Oswald,sans-serif;margin-bottom:10px}.btn{padding:8px 12px;border:1px solid #DEDBD1;background:#fff;border-radius:6px;cursor:pointer}.primary{background:#B5451C;color:#fff;border-color:#B5451C}.status{font-size:12px;color:#6F6C63}.ok{background:#EAF3DE;color:#27500A;border:1px solid #B7D58D;padding:10px;border-radius:7px}.warn{background:#FAEEDA;color:#633806;border:1px solid #E7C98C;padding:10px;border-radius:7px}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:9px}.metric{background:#FAF9F5;border-radius:7px;padding:11px}.metric small{display:block;color:#6F6C63;text-transform:uppercase;font-size:10px}.metric b{font:500 21px Oswald,sans-serif}.hidden{display:none}</style></head><body><div class="wrap">
<div class="top"><div><div class="brand">GAP ROOFING <span>&</span> CONSTRUCTION</div><div class="sub">Safe Financial Workspace</div></div><button class="btn" onclick="location.href='crm-home.html'">← Home</button></div>
<div class="card"><div class="row"><div class="field" style="flex:3 1 300px"><label>Job</label><select id="jobSelect"><option>Loading…</option></select></div><button class="btn" onclick="loadJobs()">Refresh</button></div><div id="meta" class="status" style="margin-top:8px"></div></div>
<div id="draftBanner" class="card hidden"></div><div id="workspace" class="hidden">
<div class="card"><div class="title">Insurance</div><div class="row"><div class="field"><label>RCV</label><input data-f="rcv" type="number" step=".01"></div><div class="field"><label>Deductible</label><input data-f="deductible" type="number" step=".01"></div><div class="field"><label>Insurance expected</label><input data-f="insuranceExpected" type="number" step=".01"></div><div class="field"><label>First payment</label><input data-f="firstInsurancePayment" type="number" step=".01"></div><div class="field"><label>Depreciation received</label><input data-f="depreciationReceived" type="number" step=".01"></div><div class="field"><label>Deductible collected</label><input data-f="deductibleCollected" type="number" step=".01"></div></div></div>
<div class="card"><div class="title">Costs</div><div class="row"><div class="field"><label>Materials</label><input data-f="materialCost" type="number" step=".01"></div><div class="field"><label>Roof squares</label><input data-f="roofSquares" type="number" step=".01"></div><div class="field"><label>Labor rate / sq</label><input data-f="roofLaborRate" type="number" step=".01"></div><div class="field"><label>Roof labor override</label><input data-f="roofLabor" type="number" step=".01"></div><div class="field"><label>Interior labor</label><input data-f="interiorLabor" type="number" step=".01"></div><div class="field"><label>Dump / disposal</label><input data-f="dumpDisposal" type="number" step=".01"></div><div class="field"><label>Permits</label><input data-f="permits" type="number" step=".01"></div><div class="field"><label>Delivery</label><input data-f="delivery" type="number" step=".01"></div><div class="field"><label>Other costs</label><input data-f="otherCosts" type="number" step=".01"></div><div class="field"><label>Commission rate</label><input data-f="commissionRate" type="number" step=".01"></div></div></div>
<div class="card"><div class="title">Profitability</div><div id="metrics" class="metrics"></div></div>
<div class="card"><div class="row"><button class="btn primary" onclick="saveServer()">Save / Sync</button><button class="btn" onclick="saveDraft(true)">Save Local Draft</button><button class="btn" onclick="clearDraft()">Clear Local Draft</button><span id="status" class="status"></span></div></div></div></div>
<script src="job-profitability.js"></script><script>
const FIELDS=['rcv','deductible','insuranceExpected','firstInsurancePayment','depreciationReceived','deductibleCollected','materialCost','roofSquares','roofLaborRate','roofLabor','interiorLabor','dumpDisposal','permits','delivery','otherCosts','commissionRate'];let jobs=[],current=null,dirty=false;
const CFG={url:localStorage.getItem('crm_api_url')||'',token:localStorage.getItem('crm_api_token')||''};function key(id){return 'gap_financial_draft_'+id}function money(n){return '$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
async function api(action,body){if(!CFG.url)throw new Error('CRM not configured');if(body){const r=await fetch(CFG.url,{method:'POST',cache:'no-store',body:JSON.stringify({action,token:CFG.token,...body})});return r.json()}const q=new URLSearchParams({action,token:CFG.token,_t:Date.now()});const r=await fetch(CFG.url+'?'+q,{cache:'no-store'});return r.json()}
function values(){const x={...current};FIELDS.forEach(f=>{const v=document.querySelector(`[data-f="${f}"]`).value;x[f]=v===''?'':Number(v)});return x}function render(){if(!current)return;const r=GAPProfitability.calculate(values());document.getElementById('metrics').innerHTML=[['Job Value',r.totalJobValue],['Insurance Expected',r.insuranceExpected],['Insurance Received',r.insuranceReceived],['Insurance Balance',r.insuranceBalance],['Roof Labor',r.roofLabor],['Commission',r.salesCommission],['Total Costs',r.totalCosts],['Projected Profit',r.projectedProfit],['Margin',r.projectedMarginPct.toFixed(1)+'%']].map(m=>`<div class="metric"><small>${m[0]}</small><b>${typeof m[1]==='number'?money(m[1]):m[1]}</b></div>`).join('')}
function saveDraft(manual){if(!current)return;const d={savedAt:new Date().toISOString(),values:Object.fromEntries(FIELDS.map(f=>[f,values()[f]]))};localStorage.setItem(key(current.id),JSON.stringify(d));dirty=false;if(manual)document.getElementById('status').textContent='Local draft saved ✓';showDraftBanner()}
function getDraft(){try{return JSON.parse(localStorage.getItem(key(current.id))||'null')}catch(e){return null}}function showDraftBanner(){const d=getDraft(),b=document.getElementById('draftBanner');if(!d){b.classList.add('hidden');return}b.className='card warn';b.innerHTML=`Local backup exists from ${new Date(d.savedAt).toLocaleString()}. <button class="btn" onclick="restoreDraft()">Restore</button>`}
function restoreDraft(){const d=getDraft();if(!d)return;FIELDS.forEach(f=>{if(d.values[f]!==undefined)document.querySelector(`[data-f="${f}"]`).value=d.values[f]});render();document.getElementById('status').textContent='Local draft restored';dirty=true}
function clearDraft(){if(!current)return;localStorage.removeItem(key(current.id));showDraftBanner();document.getElementById('status').textContent='Local draft cleared'}
async function loadJobs(){try{const r=await api('jobs');jobs=r.jobs||[];const s=document.getElementById('jobSelect');s.innerHTML='<option value="">Choose a job…</option>'+jobs.map(j=>`<option value="${j.id}">${j.customerName||'Unnamed'} · ${j.id}</option>`).join('');s.onchange=()=>selectJob(s.value);const req=new URLSearchParams(location.search).get('job');if(req&&jobs.some(j=>j.id===req)){s.value=req;selectJob(req)}}catch(e){document.getElementById('meta').textContent='Load failed: '+e.message}}
function selectJob(id){current=jobs.find(j=>j.id===id)||null;if(!current){document.getElementById('workspace').classList.add('hidden');return}document.getElementById('workspace').classList.remove('hidden');document.getElementById('meta').textContent=`${current.customerName} · ${current.propertyAddress||''} · ${current.jobType||'Insurance'}`;FIELDS.forEach(f=>{const el=document.querySelector(`[data-f="${f}"]`);let v=current[f];if(f==='roofLaborRate'&&(v==null||v===''))v=75;if(f==='commissionRate'&&(v==null||v===''))v=.10;el.value=v==null?'':v;el.oninput=()=>{dirty=true;render();saveDraft(false)}});showDraftBanner();render()}
async function saveServer(){if(!current)return;saveDraft(false);const patch={};FIELDS.forEach(f=>{const v=document.querySelector(`[data-f="${f}"]`).value;patch[f]=v===''?null:Number(v)});document.getElementById('status').textContent='Syncing…';try{const r=await api('updateJob',{id:current.id,patch});if(r&&r.error)throw new Error(r.error);current={...current,...patch};localStorage.removeItem(key(current.id));showDraftBanner();document.getElementById('status').textContent='Synced to CRM ✓'}catch(e){document.getElementById('status').textContent='CRM sync failed — local backup kept safely'}}
window.addEventListener('beforeunload',()=>{if(dirty&&current)saveDraft(false)});loadJobs();
</script></body></html>
