<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GAP CRM — Financial Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#F6F4EF;color:#242220;font-family:Inter,sans-serif}.wrap{max-width:1300px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:12px;align-items:end;flex-wrap:wrap;border-bottom:3px solid #B5451C;padding-bottom:12px;margin-bottom:16px}.brand{font:600 25px Oswald,sans-serif}.brand span{color:#B5451C}.sub{font-size:11px;text-transform:uppercase;color:#6F6C63}.btn{border:1px solid #DEDBD1;background:#fff;border-radius:6px;padding:8px 12px;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:16px}.card{background:#fff;border:1px solid #DEDBD1;border-radius:9px;padding:14px}.label{font-size:10.5px;color:#6F6C63;text-transform:uppercase}.value{font:500 25px Oswald,sans-serif;margin-top:5px}.table{background:#fff;border:1px solid #DEDBD1;border-radius:9px;overflow:auto}table{border-collapse:collapse;width:100%;min-width:1050px}th{font-size:10px;text-transform:uppercase;color:#6F6C63;background:#EEECE4;text-align:left;padding:9px;position:sticky;top:0}td{padding:10px 9px;border-bottom:1px solid #EEECE4;font-size:12.5px}tr:hover td{background:#FAF9F5}.money{text-align:right;font-variant-numeric:tabular-nums}.good{color:#27500A;font-weight:600}.bad{color:#791F1F;font-weight:600}.warn{color:#633806;font-weight:600}.pill{padding:3px 7px;border-radius:999px;font-size:10.5px;background:#EEECE4}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select{padding:8px 10px;border:1px solid #DEDBD1;border-radius:6px;background:#fff}.empty{padding:30px;text-align:center;color:#6F6C63}.link{color:#7A2D11;text-decoration:none;font-weight:600}
</style></head>
<body><div class="wrap">
<div class="top"><div><div class="brand">GAP ROOFING <span>&</span> CONSTRUCTION</div><div class="sub">Financial Dashboard</div></div><div><button class="btn" onclick="location.href='index.html'">← CRM</button> <button class="btn" onclick="load()">Refresh</button></div></div>
<div id="cards" class="cards"></div>
<div class="toolbar"><input id="search" placeholder="Search customer or job…"><select id="filter"><option value="all">All jobs</option><option value="insurance">Insurance only</option><option value="balance">Insurance balance due</option><option value="profit">Positive projected profit</option><option value="incomplete">Incomplete financials</option></select></div>
<div class="table"><table><thead><tr><th>Customer / Job</th><th>Stage</th><th>RCV</th><th>Insurance Expected</th><th>Insurance Received</th><th>Balance</th><th>Total Costs</th><th>Projected Profit</th><th>Margin</th><th>Financials</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty" style="display:none">No matching jobs.</div></div>
</div>
<script src="job-profitability.js"></script><script>
const CFG={url:localStorage.getItem('crm_api_url')||'',token:localStorage.getItem('crm_api_token')||''};let jobs=[];
function money(n){return '$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0})}
async function api(action){if(!CFG.url)throw new Error('CRM not configured');const q=new URLSearchParams({action,token:CFG.token,_t:Date.now()});const r=await fetch(CFG.url+'?'+q,{cache:'no-store'});return r.json()}
function completeness(j,r){let score=100;if(!Number(j.rcv))score-=25;if(j.jobType==='Insurance'&&!Number(j.deductible))score-=15;if(!Number(j.materialCost))score-=20;if(!Number(j.roofSquares)&&!Number(j.roofLabor))score-=20;if(r.insuranceBalance>0)score-=5;return Math.max(0,score)}
function calculations(){return jobs.map(j=>({j,r:GAPProfitability.calculate(j)}))}
function renderCards(data){const total=data.reduce((s,x)=>s+x.r.totalJobValue,0),profit=data.reduce((s,x)=>s+x.r.projectedProfit,0),costs=data.reduce((s,x)=>s+x.r.totalCosts,0),balance=data.reduce((s,x)=>s+x.r.insuranceBalance,0);document.getElementById('cards').innerHTML=[['Open Job Value',money(total)],['Projected Profit',money(profit)],['Known Costs',money(costs)],['Insurance Outstanding',money(balance)]].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="value">${x[1]}</div></div>`).join('')}
function render(){const q=document.getElementById('search').value.toLowerCase(),f=document.getElementById('filter').value;let data=calculations().filter(x=>!q||`${x.j.customerName||''} ${x.j.id||''} ${x.j.propertyAddress||''}`.toLowerCase().includes(q));data=data.filter(x=>f==='all'||(f==='insurance'&&x.j.jobType==='Insurance')||(f==='balance'&&x.r.insuranceBalance>0)||(f==='profit'&&x.r.projectedProfit>0)||(f==='incomplete'&&completeness(x.j,x.r)<70));renderCards(data);const rows=document.getElementById('rows');rows.innerHTML=data.map(({j,r})=>{const conf=completeness(j,r);return `<tr><td><b>${j.customerName||'Unnamed'}</b><div class="label">${j.id||''}</div></td><td>${j.stage||''}</td><td class="money">${money(r.totalJobValue)}</td><td class="money">${money(r.insuranceExpected)}</td><td class="money">${money(r.insuranceReceived)}</td><td class="money ${r.insuranceBalance>0?'warn':''}">${money(r.insuranceBalance)}</td><td class="money">${money(r.totalCosts)}</td><td class="money ${r.projectedProfit>=0?'good':'bad'}">${money(r.projectedProfit)}</td><td class="money">${r.projectedMarginPct.toFixed(1)}%</td><td><a class="link" href="financials.html?job=${encodeURIComponent(j.id)}">Open</a><div class="label">${conf}% confidence</div></td></tr>`}).join('');document.getElementById('empty').style.display=data.length?'none':'block'}
async function load(){try{const r=await api('jobs');jobs=(r.jobs||[]).filter(j=>j.closed!=='Yes');render()}catch(e){document.getElementById('empty').style.display='block';document.getElementById('empty').textContent='Could not load jobs: '+e.message}}
document.getElementById('search').oninput=render;document.getElementById('filter').onchange=render;load();
</script></body></html>
