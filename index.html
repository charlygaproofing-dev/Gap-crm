  if (!v) return "";

function calcCommission(j) {
  if (j.commission != null && j.commission !== "" && Number(j.commission) !== 0) return Number(j.commission);

  if (!s) return null;
  const d = new Date(s + "T00:00:00");
  return isNaN(d.getTime()) ? null : d;
}
function daysSinceActivity(j) {
  const a = parseDate(j.lastUpdated),
    b = parseDate(j.dateEntered);
  const d = a && b ? a > b ? a : b : a || b;

  const now = new Date();
  now.setHours(0, 0, 0, 0);

<script>
const SHAPES = {
  gable:      { name:"Simple Gable",     desc:"Two slopes, no hips or valleys",       waste:10, ridgeFt:0.40, hipFt:0,    valleyFt:0,    eaveFt:1.00, rakeFt:0.60 },
  hip:        { name:"Hip Roof",         desc:"Slopes on all sides, no valleys",      waste:12, ridgeFt:0.30, hipFt:0.50, valleyFt:0,    eaveFt:1.30, rakeFt:0    },
  gableValley:{ name:"Gable + Valleys",  desc:"L-shape, addition, or dormers",        waste:15, ridgeFt:0.35, hipFt:0,    valleyFt:0.30, eaveFt:1.00, rakeFt:0.50 },
  complex:    { name:"Complex / Cut-up", desc:"Hips, valleys & multiple dormers",     waste:20, ridgeFt:0.25, hipFt:0.30, valleyFt:0.40, eaveFt:1.20, rakeFt:0.30 }

function buildShapeGrid(){

    div.className = "shape-opt" + (key === selectedShape ? " active" : "");
    div.innerHTML = '<div class="name">' + s.name + '</div><div class="desc">' + s.desc + '</div>';

function roundUp(n, step) { step = step || 1; return Math.ceil(n / step) * step; }

function calculate(){
  const squares = parseFloat(document.getElementById("squares").value) || 0;
  const shape = SHAPES[selectedShape];
  const wasteOverride = document.getElementById("waste").value;
  const wastePct = (wasteOverride !== "" && !isNaN(wasteOverride)) ? parseFloat(wasteOverride) : shape.waste;
  const wasteMult = 1 + (wastePct / 100);
  const ridgeFt = shape.ridgeFt * squares, hipFt = shape.hipFt * squares, valleyFt = shape.valleyFt * squares;
  const eaveFt = shape.eaveFt * squares, rakeFt = shape.rakeFt * squares;
  const perimeterFt = eaveFt + rakeFt, ridgeHipFt = ridgeFt + hipFt;

  document.getElementById("sumSquares").textContent = squares.toFixed(1) + " sq";
  document.getElementById("sumShape").textContent = shape.name;
  document.getElementById("sumWaste").textContent = wastePct + "%";

  const pipeBoots = parseInt(document.getElementById("pipeBoots").value) || 0;
  const chimneys = parseInt(document.getElementById("chimneys").value) || 0;
  const skylights = parseInt(document.getElementById("skylights").value) || 0;
  const sidewall = parseFloat(document.getElementById("sidewall").value) || 0;

  const rows = [];
  rows.push({group:"Shingles & Underlayment"});
  rows.push(["Architectural shingles", "bundle", roundUp(squares * 3 * wasteMult), "3 bundles/square"]);
  rows.push(["Starter strip shingles", "bundle", roundUp((eaveFt / 120) * wasteMult), "Along eaves, ~120 ft/bundle"]);
  rows.push(["Ridge cap shingles", "bundle", roundUp((ridgeHipFt / 33) * wasteMult), "Ridge + hip length, ~33 ft/bundle"]);
  rows.push(["Synthetic underlayment", "roll", roundUp((squares / 10) * wasteMult), "~10 squares/roll"]);
  rows.push(["Ice & water shield", "roll", roundUp(((eaveFt + valleyFt * 2) / 66) * wasteMult), "Eaves + valleys, 3 ft wide roll"]);
  rows.push({group:"Flashing & Edging"});
  rows.push(["Drip edge", "10 ft piece", roundUp((perimeterFt / 10) * wasteMult), "Eaves + rakes"]);
  rows.push(["Ridge vent", "4 ft section", roundUp(ridgeFt / 4), "Along ridge only"]);
  if (valleyFt > 0) rows.push(["Valley metal (W-valley)", "10 ft piece", roundUp((valleyFt / 10) * wasteMult), "Open valleys"]);
  if (sidewall > 0) rows.push(["Step flashing", "bundle", roundUp(sidewall / 25), "1 bundle \u2248 25 linear ft of sidewall"]);
  rows.push({group:"Fasteners & Sealant"});
  rows.push(["Roofing nails (coil/box)", "50 lb box", roundUp(squares / 13, 1) || 1, "Ring-shank, ~13 squares/box"]);
  rows.push(["Roofing/flashing cement", "10.3 oz tube", roundUp(squares / 2) || 1, "Detail & flashing seal"]);
  const penetrationRows = [];
  if (pipeBoots > 0) penetrationRows.push(["Pipe boots", "each", pipeBoots, "1 per vent stack"]);
  if (chimneys > 0) penetrationRows.push(["Chimney flashing kit", "each", chimneys, "Size to chimney"]);
  if (skylights > 0) penetrationRows.push(["Skylight flashing kit", "each", skylights, "Match to model"]);

  const tbody = document.getElementById("resultsBody");
  tbody.innerHTML = "";
  rows.forEach(r => {
    if (r.group){
      const tr = document.createElement("tr"); tr.className = "group-row";
      tr.innerHTML = '<td colspan="4">' + r.group + '</td>'; tbody.appendChild(tr); return;
    }
    const [material, unit, qty, notes] = r;
    const tr = document.createElement("tr");
    tr.innerHTML = '<td class="material">' + material + '</td><td class="unit">' + unit + '</td><td class="num qty">' + qty + '</td><td class="notes">' + notes + '</td>';
    tbody.appendChild(tr);
  });
  lastRows = rows.filter(r => !r.group).map(r => ({ material: r[0], unit: r[1], qty: r[2], notes: r[3] }));
  return { squares, shapeName: shape.name, wastePct };
}
