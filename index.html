<body>
<div class="sheet">
  <div class="header">
    <div>
      <div class="company">GAP <span>ROOFING</span> & CONSTRUCTION</div>
      <div class="sub">Insurance Invoice</div>
    </div>
    <div>
      <div class="title">Invoice</div>
      <div class="meta">${today} &middot; Job ${escapeHtml(job.id)}</div>
    </div>
  </div>

  <div class="infoGrid">
    <div><b>Customer</b>${escapeHtml(job.customerName || "")}</div>
    <div><b>Property Address</b>${escapeHtml(job.propertyAddress || "")}</div>
    <div><b>Insurance Company</b>${escapeHtml(job.insuranceCarrier || "\u2014")}</div>
    <div><b>Claim #</b>${escapeHtml(job.claimNum || "\u2014")}</div>
  </div>

  <div class="section">
    <h3>Completed scope</h3>
    <textarea id="scopeDesc" rows="3" placeholder="Describe the work GAP actually completed for this invoice...">${escapeHtml(scopeVal)}</textarea>
  </div>

  <div class="section">
    <h3>Total authorized invoice amount</h3>
    <div style="font-size:11px; color:#9A9587; margin-bottom:6px;">Based only on completed work \u2014 not automatically the full insurance claim.</div>
    <input type="number" id="authorizedAmount" min="0" step="0.01" value="${authorizedVal}" style="max-width:200px;">
  </div>

  <div class="section">
    <h3>Payment summary</h3>
    <table>
      <tr><td class="label">Insurance payments received</td><td class="amount">${fmtMoney(calc.insurancePaymentsReceived)}</td></tr>
      <tr><td class="label">Customer payments received</td><td class="amount">${fmtMoney(calc.customerPaymentsReceived)}</td></tr>
      <tr><td class="label">Recoverable depreciation ${job.insRecoverableDepreciationReleased === "Yes" ? "(released)" : "(pending release)"}</td><td class="amount">${fmtMoney(calc.recoverableDep)}</td></tr>
      <tr><td class="label">Supplements pending/approved</td><td class="amount">${fmtMoney(Number(job.insSupplementsApproved) || 0)}</td></tr>
      <tr class="total"><td>Remaining balance on this invoice</td><td class="amount" id="remainingCell">\u2014</td></tr>
    </table>
    ${job.insRecoverableDepreciationReleased !== "Yes" && calc.recoverableDep > 0 ? '<div class="pending-note">\u26A0 Recoverable depreciation has not been released. This invoice includes a request to release it below.</div>' : ""}
  </div>

  <div class="section noprint">
    <h3>Completion photographs</h3>
    <div style="font-size:12px; color:#6F6C63;">Attach or link photos separately via the job's Documents section in the CRM \u2014 not stored on this invoice page.</div>
  </div>

  ${job.insRecoverableDepreciationReleased !== "Yes" && calc.recoverableDep > 0 ? `
  <div class="section">
    <h3>Request to release recoverable depreciation</h3>
    <div style="font-size:13px;">GAP Roofing & Construction hereby requests release of the recoverable depreciation amount of <b>${fmtMoney(calc.recoverableDep)}</b> for Job ${escapeHtml(job.id)}, Claim #${escapeHtml(job.claimNum || "")}, as the authorized scope of work has been completed.</div>
  </div>` : ""}

  <div class="btns noprint">
    <button class="btn btn-accent" id="saveBtn">Save to job</button>
    <button class="btn btn-outline" onclick="window.print()">Print</button>
    <button class="btn btn-outline" onclick="window.close()">Cancel / Close</button>
    <span id="saveStatus"></span>
  </div>
</div>

<script>
const JOB2 = ${jobDataJson};
const CFG3 = ${cfgJson};
const CALC2 = ${calcJson};

function fmtMoney2(n) { return "$" + (Number(n)||0).toFixed(2); }

function updateRemaining() {
  const authorized = parseFloat(document.getElementById("authorizedAmount").value) || 0;
  const collected = CALC2.insurancePaymentsReceived + CALC2.customerPaymentsReceived;
  const remaining = authorized - collected;
  document.getElementById("remainingCell").textContent = fmtMoney2(remaining);
}
document.getElementById("authorizedAmount").addEventListener("input", updateRemaining);
updateRemaining();

document.getElementById("saveBtn").addEventListener("click", async () => {
  const statusEl = document.getElementById("saveStatus");
  statusEl.textContent = "Saving...";
  try {
    const res = await fetch(CFG3.url, {
      method: "POST",
      body: JSON.stringify({
        action: "updateJob", token: CFG3.token, id: JOB2.id,
        patch: {
          insCompletedScopeDescription: document.getElementById("scopeDesc").value,
          insAuthorizedInvoiceAmount: parseFloat(document.getElementById("authorizedAmount").value) || null
        }
      })
    });
    const data = await res.json();
    statusEl.textContent = data && data.ok ? "Saved to job \u2713" : "Save failed";
  } catch (err) {
    statusEl.textContent = "Save failed \u2014 check connection";
  }
});
<\/script>
</body></html>`;
}
function openInsuranceInvoice(job, calc) {
  const html = buildInsuranceInvoiceHTML(job, calc);
  const win = window.open("", "_blank");
  if (win) {
    win.document.write(html);
    win.document.close();
  }
}
ReactDOM.createRoot(document.getElementById('root')).render(/*#__PURE__*/React.createElement(App, null));
</script>
</body>
