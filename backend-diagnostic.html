<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GAP CRM — Backend Diagnostic</title><style>body{font-family:Arial,sans-serif;background:#f6f4ef;color:#242220;margin:0;padding:24px}.wrap{max-width:900px;margin:auto}.card{background:#fff;border:1px solid #dedbd1;border-radius:10px;padding:18px;margin-bottom:14px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}select,button{padding:8px 10px;border:1px solid #dedbd1;border-radius:6px;background:#fff}button{cursor:pointer}.primary{background:#b5451c;color:#fff;border-color:#b5451c}.ok{color:#27500a}.bad{color:#791f1f}.mono{font-family:ui-monospace,monospace;font-size:12px;white-space:pre-wrap}.note{font-size:12px;color:#6f6c63;line-height:1.5}</style></head><body><div class="wrap"><div class="card"><h2>Backend Financial Field Diagnostic</h2><p class="note">This performs a no-op update: it sends the currently stored financial values back to the same job, then reloads the job list and compares the fields. It should not intentionally change any business value.</p></div><div class="card"><div class="row"><div style="flex:1"><label>Job</label><br><select id="job" style="width:100%"><option>Loading…</option></select></div><button class="primary" onclick="runTest()">Run No-Op Test</button><button onclick="location.href='crm-home.html'">Back</button></div></div><div class="card"><div id="status">Ready.</div><div id="results" class="mono"></div></div></div><script>
const FIELDS=['rcv','acv','deductible','recoverableDepreciation','approvedSupplements','insuranceExpected','firstInsurancePayment','depreciationReceived','supplementPaymentsReceived','deductibleCollected','roofLabor','interiorLabor','dumpDisposal','permits','delivery','otherCosts','commissionRate','roofSquares','roofLaborRate'];
const CFG={url:localStorage.getItem('crm_api_url')||'',token:localStorage.getItem('crm_api_token')||''};let jobs=[];
async function api(action,body){if(!CFG.url)throw new Error('CRM not configured');if(body){const r=await fetch(CFG.url,{method:'POST',cache:'no-store',body:JSON.stringify({action,token:CFG.token,...body})});return r.json()}const q=new URLSearchParams({action,token:CFG.token,_t:Date.now()});const r=await fetch(CFG.url+'?'+q,{cache:'no-store'});return r.json()}
function norm(v){return v===undefined?null:v===null?null:v===''?null:(Number.isFinite(Number(v))?Number(v):v)}
async function load(){try{const r=await api('jobs');jobs=r.jobs||[];document.getElementById('job').innerHTML='<option value="">Choose a job…</option>'+jobs.map(j=>`<option value="${j.id}">${j.customerName||'Unnamed'} · ${j.id}</option>`).join('')}catch(e){document.getElementById('status').textContent='Load failed: '+e.message}}
async function runTest(){const id=document.getElementById('job').value;if(!id)return;const before=jobs.find(j=>j.id===id);const patch={};FIELDS.forEach(f=>patch[f]=before[f]===undefined?null:before[f]);document.getElementById('status').textContent='Running no-op update…';document.getElementById('results').textContent='';try{const u=await api('updateJob',{id,patch});if(u&&u.error)throw new Error(u.error);const r=await api('jobs');const after=(r.jobs||[]).find(j=>j.id===id);const lines=[];let failures=0;FIELDS.forEach(f=>{const a=norm(before[f]),b=norm(after?after[f]:undefined);const same=String(a)===String(b);if(!same)failures++;lines.push(`${same?'PASS':'FAIL'}  ${f}: before=${JSON.stringify(a)} after=${JSON.stringify(b)}`)});document.getElementById('results').textContent=lines.join('\n');document.getElementById('status').innerHTML=failures?`<span class="bad">${failures} field(s) did not round-trip unchanged.</span>`:`<span class="ok">All ${FIELDS.length} financial fields round-tripped successfully ✓</span>`;jobs=r.jobs||[]}catch(e){document.getElementById('status').innerHTML=`<span class="bad">Backend diagnostic failed: ${e.message}</span>`}}
load();
</script></body></html>
